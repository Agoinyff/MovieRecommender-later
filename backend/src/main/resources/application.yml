spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

server:
  port: 8080

logging:
  level:
    root: INFO
    com.rcd.movierecommender.backend: DEBUG
    org.springframework.cache: DEBUG

model:
  build:
    cron: "0 0 * * * ?"      # 每小时执行一次
    timeout: 300000           # 构建超时时间（5分钟）
    startup-delay: 5000      # 启动后延迟30秒开始预热

tmdb:
  api:
    key: ${TMDB_API_KEY:764d5a982fef573bdd8da60b1a23224e}
    read-token: ${TMDB_READ_TOKEN:eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI3NjRkNWE5ODJmZWY1NzNiZGQ4ZGE2MGIxYTIzMjI0ZSIsIm5iZiI6MTc2ODc5Mjk1Mi45ODUsInN1YiI6IjY5NmRhMzc4OTNiOGRiY2I2OThmY2RmYyIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.XTnl6GtxkBtcuWjfTcWk-JfIJRlXn7KCpNylArl9ung}
