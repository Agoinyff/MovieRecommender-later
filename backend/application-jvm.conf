# JVM 内存配置文件
# 根据你的数据量和服务器配置调整这些参数

# 最小堆内存（建议至少 512MB）
-Xms512m

# 最大堆内存（根据数据量调整，建议 1GB 起步）
# 如果评分数据量 < 10万条：1GB
# 如果评分数据量 10-50万条：2GB
# 如果评分数据量 50-100万条：4GB
# 如果评分数据量 > 100万条：6-8GB
-Xmx2048m

# 新生代大小（建议为最大堆的 1/3）
-Xmn512m

# 使用 G1 垃圾回收器（适合大内存）
-XX:+UseG1GC

# G1 回收器最大暂停时间目标（毫秒）
-XX:MaxGCPauseMillis=200

# 设置堆外内存大小
-XX:MaxMetaspaceSize=256m

# GC 日志配置（用于监控和调优）
-XX:+PrintGCDetails
-XX:+PrintGCDateStamps
-XX:+PrintGCTimeStamps
-Xloggc:logs/gc.log

# 当发生 OOM 时自动生成堆转储文件
-XX:+HeapDumpOnOutOfMemoryError
-XX:HeapDumpPath=logs/heapdump.hprof

# 优化大对象分配
-XX:LargePageSizeInBytes=128m

# 并行 GC 线程数（根据 CPU 核心数调整）
-XX:ParallelGCThreads=4

# 字符串去重（节省内存）
-XX:+UseStringDeduplication

