app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:movie_recommender_token}
    secret: ${AUTH_JWT_SECRET:change-this-secret-in-env-at-least-32-bytes}
    expires-hours: ${AUTH_EXPIRES_HOURS:24}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123456}
