spring:
  datasource:
    url: jdbc:mysql://localhost:3306/movie?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30  # 默认查询超时30秒

server:
  port: 8080

logging:
  level:
    root: INFO
    com.rcd.movierecommender.backend: DEBUG
    org.springframework.cache: DEBUG

# 数据模型构建配置
model:
  build:
    cron: "0 0 * * * ?"      # 每小时执行一次
    timeout: 300000           # 构建超时时间（5分钟）
    startup-delay: 30000      # 启动后延迟30秒开始预热

